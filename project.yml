name: PocketPad
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
targets:
  PocketPadMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/Shared
      - path: Sources/Mac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codybontecou.PocketPadMac
        PRODUCT_NAME: PocketPad Mac
        INFOPLIST_FILE: Resources/Mac/Info.plist
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
  PocketPadiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/Shared
      - path: Sources/iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codybontecou.PocketPad.iOS
        PRODUCT_NAME: PocketPad
        INFOPLIST_FILE: Resources/iOS/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 67KC823C9A
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
