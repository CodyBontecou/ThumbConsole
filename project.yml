name: ThumbConsole
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 2
    VERSIONING_SYSTEM: apple-generic
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
targets:
  ThumbConsoleMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/Shared
      - path: Sources/Mac
      - path: Resources/Mac/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codybontecou.PocketPadMac
        PRODUCT_NAME: ThumbConsole Mac
        INFOPLIST_FILE: Resources/Mac/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 67KC823C9A
        ENABLE_HARDENED_RUNTIME: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
  ThumbConsoleCLI:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/Shared
      - path: Sources/Mac/KeyMap.swift
      - path: Sources/Mac/MacControlOutputBinding.swift
      - path: Sources/CLI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codybontecou.PocketPad
        PRODUCT_NAME: thumbconsole
        "CODE_SIGN_IDENTITY[sdk=macosx*]": Apple Development
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 67KC823C9A
        MACOSX_DEPLOYMENT_TARGET: "14.0"
  ThumbConsoleLegacyCLI:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/Shared
      - path: Sources/Mac/KeyMap.swift
      - path: Sources/Mac/MacControlOutputBinding.swift
      - path: Sources/CLI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codybontecou.PocketPadCLI
        PRODUCT_NAME: pocketpad
        "CODE_SIGN_IDENTITY[sdk=macosx*]": Apple Development
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 67KC823C9A
        MACOSX_DEPLOYMENT_TARGET: "14.0"
  ThumbConsoleCLITests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/Shared
      - path: Sources/Mac/KeyMap.swift
      - path: Sources/Mac/MacControlOutputBinding.swift
      - path: Sources/iOS/IOSLocalKeypadUX.swift
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codybontecou.PocketPadCLITests
        PRODUCT_NAME: ThumbConsoleCLITests
        GENERATE_INFOPLIST_FILE: YES
        OTHER_SWIFT_FLAGS: "$(inherited) -D XCODEBUILD_TEST"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 67KC823C9A
        MACOSX_DEPLOYMENT_TARGET: "14.0"
  ThumbConsoleiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/Shared
      - path: Sources/iOS
      - path: Resources/iOS/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codybontecou.PocketPad.iOS
        PRODUCT_NAME: ThumbConsole
        INFOPLIST_FILE: Resources/iOS/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 67KC823C9A
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Enforce Controller Stack Budget
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" = "Debug" ]; then
            python3 "$SRCROOT/scripts/check-controller-stack-frames.py" \
              --object-root "${OBJECT_FILE_DIR_normal:-$OBJECT_FILE_DIR}"
          fi
schemes:
  ThumbConsoleMac:
    build:
      targets:
        ThumbConsoleMac: all
    run:
      config: Debug
    archive:
      config: Release
  ThumbConsoleiOS:
    build:
      targets:
        ThumbConsoleiOS: all
    run:
      config: Debug
    archive:
      config: Release
  ThumbConsoleCLI:
    build:
      targets:
        ThumbConsoleCLI: all
        ThumbConsoleLegacyCLI: all
        ThumbConsoleCLITests: [test]
    test:
      targets:
        - ThumbConsoleCLITests
