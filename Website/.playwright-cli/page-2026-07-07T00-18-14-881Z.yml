          - heading "First-run setup" [level=2] [ref=e76]
          - list [ref=e77]:
            - listitem [ref=e78]:
              - strong [ref=e79]: Open ThumbConsole Mac.
              - paragraph [ref=e80]: The Home screen shows readiness for Accessibility, the helper server, and iPhone pairing. A first-run setup guide walks through the same steps.
            - listitem [ref=e81]:
              - strong [ref=e82]: Enable Accessibility.
              - paragraph [ref=e83]:
                - text: Click
                - emphasis [ref=e84]: Request Accessibility Permission
                - text: or
                - emphasis [ref=e85]: Open Accessibility Settings
                - text: ", then enable ThumbConsole Mac in System Settings → Privacy & Security → Accessibility."
            - listitem [ref=e86]:
              - strong [ref=e87]: Open ThumbConsole on iPhone.
              - paragraph [ref=e88]: The iOS onboarding explains Local Network and Camera prompts. Tap Smart Connect, or use Scan Mac QR Code if this is the first pairing.
            - listitem [ref=e89]:
              - strong [ref=e90]: Pair securely.
              - paragraph [ref=e91]:
                - text: Scan the QR code on the Mac, or manually enter a displayed
                - code [ref=e92]: ws://<mac-ip>:<port>
                - text: address. If prompted, type the six-digit code shown on ThumbConsole Mac.
            - listitem [ref=e93]:
              - strong [ref=e94]: Focus the target Mac app.
              - paragraph [ref=e95]: After pairing, ThumbConsole controls whichever Mac app is currently focused. Use Release All if a key ever feels stuck.
        - generic [ref=e96]:
          - generic [ref=e97]:
            - paragraph [ref=e98]: mac app
            - heading "Home, Keypad, and Settings" [level=2] [ref=e99]
            - paragraph [ref=e100]: The Mac app is the source of truth for saved keypads and bindings. It runs the server, displays QR and manual pairing information, previews the active keypad, and exposes diagnostics.
            - heading "Home" [level=3] [ref=e101]
            - paragraph [ref=e102]: Use Home to check readiness, copy the pairing code, scan QR from the iPhone, switch profiles, make a setup the default, and perform quick local shortcut tests.
            - heading "Keypad" [level=3] [ref=e103]
            - paragraph [ref=e104]: Use Keypad to visually edit layouts, manage profiles, record shortcuts, configure output mode, and sync changes to the connected iPhone.
            - heading "Settings" [level=3] [ref=e105]
            - paragraph [ref=e106]: Use Settings for appearance defaults, input diagnostics, local addresses, server restart/stop, and advanced connection troubleshooting.
