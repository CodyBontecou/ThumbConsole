          - paragraph [ref=e42]: overview
          - heading "What ThumbConsole does" [level=2] [ref=e43]
          - paragraph [ref=e44]: ThumbConsole turns an iPhone into a programmable control surface for a Mac. The macOS helper hosts a local pairing server, stores keypad profiles, and sends keyboard, pointer, or virtual gamepad output to the focused app. The iOS app displays the synced keypad and sends low-latency button, joystick, trigger, and trackpad input over your local network.
          - generic [ref=e45]:
            - generic [ref=e46]:
              - generic [ref=e47]: macOS
              - heading "Helper + editor" [level=3] [ref=e48]
              - paragraph [ref=e49]: Grant Accessibility, pair iPhones, manage profiles, record shortcuts, and edit each keypad visually.
            - generic [ref=e50]:
              - generic [ref=e51]: iOS
              - heading "Touch controller" [level=3] [ref=e52]
              - paragraph [ref=e53]: Use synced profiles, switch setups, export keypads, toggle haptics, and make quick freeform layout edits.
            - generic [ref=e54]:
              - generic [ref=e55]: CLI
              - heading "Scriptable parity" [level=3] [ref=e56]
              - paragraph [ref=e57]: Generate, import, export, select, bind, inspect, and test keypads from the terminal.
