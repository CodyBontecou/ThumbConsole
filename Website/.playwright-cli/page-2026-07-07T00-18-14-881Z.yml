            - heading "Connection screen and controller screen" [level=2] [ref=e113]
            - paragraph [ref=e114]: The iOS app starts on a connection screen unless it can reconnect to a trusted Mac or show a saved keypad offline.
            - heading "Connection screen" [level=3] [ref=e115]
            - paragraph [ref=e116]: Use Smart Connect for remembered Macs, scan a Mac QR code for first-time pairing, or manually enter host and port. You can also view the last synced keypad when offline.
            - heading "Controller screen" [level=3] [ref=e117]
            - paragraph [ref=e118]: The top bar shows connection status, the active keypad setup, edit lock, haptics and appearance settings, export actions, and Disconnect. Swipe down from the top edge if the bar is hidden.
            - heading "Offline saved keypad" [level=3] [ref=e119]
            - paragraph [ref=e120]: After a successful sync, iPhone can display saved profiles even when ThumbConsole Mac is closed. Input only controls the Mac while connected.
          - figure "Portrait keypad with synced controls and top bar actions." [ref=e121]:
            - img "ThumbConsole iPhone portrait keypad" [ref=e122]
