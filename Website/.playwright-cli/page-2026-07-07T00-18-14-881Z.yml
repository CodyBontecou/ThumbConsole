          - heading "Build a keypad setup" [level=2] [ref=e126]
          - paragraph [ref=e127]: A setup is a saved profile containing layout, output mode, bindings, colors, haptics, style tokens, assets, and per-orientation variants. Edits on Mac save automatically and sync to the paired iPhone.
          - generic [ref=e128]:
            - generic [ref=e129]:
              - generic [ref=e130]: profiles
              - heading "Setups and templates" [level=3] [ref=e131]
              - paragraph [ref=e132]: Create, duplicate, delete, switch, import, export, and mark defaults. The active setup is sent to the iPhone and can be changed from either device.
            - generic [ref=e133]:
              - generic [ref=e134]: canvas
              - heading "Device frames" [level=3] [ref=e135]
              - paragraph [ref=e136]: Match the editor to the connected iPhone, choose any supported iPhone display class, or use a custom canvas size. Portrait and landscape variants are saved separately.
            - generic [ref=e137]:
              - generic [ref=e138]: layout
              - heading "Controls and grid" [level=3] [ref=e139]
              - paragraph [ref=e140]: Add buttons, joysticks, triggers, and trackpads. Drag on the canvas, nudge, align, distribute, layer, group, and use snap/grid preferences for precision.
            - generic [ref=e141]:
              - generic [ref=e142]: design
              - heading "Styles and haptics" [level=3] [ref=e143]
              - paragraph [ref=e144]: Customize fills, strokes, pressed states, icons, glows, reusable style tokens, background fills, gradients, image fills, and per-control haptic patterns.
