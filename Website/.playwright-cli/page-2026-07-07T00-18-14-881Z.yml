          - paragraph [ref=e223]: safety
          - heading "Local, authenticated, and recoverable input" [level=2] [ref=e224]
          - list [ref=e225]:
            - listitem [ref=e226]: Pairing uses a six-digit setup challenge and trusted reconnect token.
            - listitem [ref=e227]:
              - text: Input travels over the local network; Smart Connect advertises as
              - code [ref=e228]: _pocketpad._tcp
              - text: .
            - listitem [ref=e229]: Button state transitions use compact authenticated UDP frames with WebSocket mirroring for recovery.
            - listitem [ref=e230]: macOS releases held keys after heartbeat timeout, disconnect, server stop, manual Release All, and app quit.
            - listitem [ref=e231]: iOS sends a best-effort Release All when disconnecting, backgrounding, or becoming inactive.
        - generic [ref=e232]:
