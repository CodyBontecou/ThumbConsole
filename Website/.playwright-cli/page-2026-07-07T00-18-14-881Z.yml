        - generic [ref=e197]:
          - paragraph [ref=e198]: cli
          - heading "Script ThumbConsole with thumbconsole" [level=2] [ref=e199]:
            - text: Script ThumbConsole with
            - code [ref=e200]: thumbconsole
          - paragraph [ref=e201]: The CLI mirrors the saved-configuration features in the Mac Keypad editor and adds runtime helper commands for automation and debugging.
          - code [ref=e203]: thumbconsole profile list --ids thumbconsole template list thumbconsole template install snes --name "SNES Browser Controls" --default thumbconsole profile export --all -o thumbconsole-profiles.json thumbconsole profile import thumbconsole-profiles.json thumbconsole binding set focus --sequence 'Control+B,H' thumbconsole output mode keyboard thumbconsole element add joystick --label "Right Stick" --up custom1 --down custom2 --left custom3 --right custom4 thumbconsole element set jump --label A --shape circle --width 1.2 --height 1.2
          - heading "Runtime helper commands" [level=3] [ref=e204]
          - code [ref=e206]: thumbconsole app open thumbconsole status --json thumbconsole server restart thumbconsole pairing payload thumbconsole accessibility status thumbconsole test tap jump thumbconsole release-all
          - paragraph [ref=e207]: When ThumbConsole Mac is running, CLI profile, customization, and binding changes are pushed to the app via distributed notifications and then synced to the paired iPhone.
