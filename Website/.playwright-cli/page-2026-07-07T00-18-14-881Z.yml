          - group [ref=e211]:
            - generic "Smart Connect does not find my Mac" [ref=e212] [cursor=pointer]
            - paragraph [ref=e213]: Make sure both devices are on the same Wi‑Fi network, ThumbConsole Mac is running, Local Network permission is allowed, and the Mac helper shows a local address. Use QR pairing as a fallback.
