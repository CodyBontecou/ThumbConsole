      function dragCancel(){if(state.drag){state.drag.group.setAttribute("transform",state.drag.base);state.drag=null}}
      async function editElement(elementId,changes){if(state.busy||state.saved||!state.draft)return;setBusy(true,"Applying revision-checked edit…");try{const result=structured(await callTool("edit_configuration_draft",{draftId:state.draft.draftId,expectedDraftRevision:state.draft.draftRevision,operationId:uuid(),operation:{type:"element.set",profileID:state.controller.profile.id,variant:state.editableVariant,elementID:elementId,changes}}));state.draft=result.draft;await refreshPreview();setStatus(result.changed?"Draft updated. Save explicitly when ready.":"No effective change.")}catch(error){await recover(error)}finally{setBusy(false)}}
      async function refreshPreview(){const result=structured(await callTool("preview_configuration_draft",{draftId:state.draft.draftId,expectedDraftRevision:state.draft.draftRevision}));render(result)}
      function recoveryMessage(error,refreshed){const detail=String(error&&error.message||error),prefix=refreshed?"Draft refreshed. ":"Draft could not be refreshed. ";if(error&&error.code==="configuration_revision_conflict")return`${prefix}The controller configuration changed from r${error.expectedRevision} to r${error.actualRevision}. Click Rebase, review the merged layout, then save again.`;if(error&&error.code==="draft_revision_conflict")return`${prefix}This draft changed in another view. Retry your edit on the latest draft.`;if(error&&error.code==="configuration_bridge_failed")return`${prefix}The edit was not applied because the native configuration bridge rejected its response. Retry the edit.`;return`${detail} ${prefix}Retry the action.`}
      async function recover(error){let refreshed=false;try{const result=structured(await callTool("get_configuration_draft",{draftId:state.draft.draftId}));state.draft=result;await refreshPreview();refreshed=true}catch(_){}setStatus(recoveryMessage(error,refreshed),true)}
      function setBusy(busy,message){state.busy=busy;["apply","validate","rebase","discard","save"].forEach(id=>$(id).disabled=busy||state.saved);if(message)setStatus(message)}
      function setStatus(message,error=false){status.textContent=message;status.classList.toggle("error",error)}
      function showError(message){waiting.textContent=message;stage.replaceChildren(waiting);setStatus(message,true);setBusy(false);requestAnimationFrame(reportSize)}
      $("apply").addEventListener("click",async()=>{const x=Number(xInput.value),y=Number(yInput.value);if(!state.selectedId||!validNumber(x,0,1)||!validNumber(y,0,1))return setStatus("Enter center values from 0 through 1.",true);await editElement(state.selectedId,{label:labelInput.value,centerX:x,centerY:y})});
      $("validate").addEventListener("click",async()=>{if(!state.draft)return;setBusy(true,"Validating exact draft revision…");try{const result=structured(await callTool("validate_configuration_draft",{draftId:state.draft.draftId,expectedDraftRevision:state.draft.draftRevision}));setStatus(result.valid?`Valid · ${result.validator} · ${result.warningCount} warning(s)`:`Invalid · ${result.errorCount} error(s)`,!result.valid)}catch(error){await recover(error)}finally{setBusy(false)}});
      $("rebase").addEventListener("click",async()=>{if(!state.draft||state.saved)return;setBusy(true,"Reading authoritative revision for three-way rebase…");try{const current=structured(await callTool("configuration_status",{}));const result=structured(await callTool("rebase_configuration_draft",{draftId:state.draft.draftId,expectedDraftRevision:state.draft.draftRevision,expectedConfigurationRevision:current.configurationRevision,rebaseId:uuid()}));state.draft=result.draft;await refreshPreview();setStatus(result.changed?`Rebased onto configuration r${state.draft.baseConfigurationRevision}. Review and save explicitly.`:"Draft already matches the authoritative revision.")}catch(error){await recover(error)}finally{setBusy(false)}});
      $("save").addEventListener("click",async()=>{if(!state.draft||state.saved)return;setBusy(true,"Requesting atomic save…");try{const result=structured(await callTool("save_configuration_draft",{draftId:state.draft.draftId,expectedDraftRevision:state.draft.draftRevision,expectedConfigurationRevision:state.draft.baseConfigurationRevision,commitId:uuid()}));state.saved=true;setStatus(`Saved as configuration r${result.configurationRevision}${result.phoneSyncQueued?" · phone sync queued":""}.`);revision.textContent=`Saved r${result.configurationRevision}`}catch(error){await recover(error)}finally{setBusy(false)}});
      $("discard").addEventListener("click",async()=>{if(!state.draft||state.saved)return;setBusy(true,"Discarding unsaved draft…");try{structured(await callTool("discard_configuration_draft",{draftId:state.draft.draftId,expectedDraftRevision:state.draft.draftRevision}));state.saved=true;setStatus("Draft discarded. Authoritative controller was unchanged.");stage.replaceChildren(Object.assign(document.createElement("div"),{className:"waiting",textContent:"Draft discarded."}))}catch(error){await recover(error)}finally{setBusy(false)}});
      function reportSize(){const rect=document.documentElement.getBoundingClientRect();notify("ui/notifications/size-changed",{width:Math.ceil(rect.width),height:Math.ceil(document.documentElement.scrollHeight)})}
      window.addEventListener("message",event=>{if(event.source!==window.parent)return;const message=event.data;if(!message||message.jsonrpc!=="2.0")return;const pending=state.pending.get(message.id);if(pending&&typeof message.method!=="string"){state.pending.delete(message.id);if(message.error)pending.reject(new Error(message.error.message||"Tool call failed."));else pending.resolve(message.result);return}const isInitializeResponse=!state.initialized&&state.initializeId!==undefined&&message.id===state.initializeId&&typeof message.method!=="string"&&(message.error||(message.result&&Object.prototype.hasOwnProperty.call(message.result,"protocolVersion")));if(isInitializeResponse){state.initializeId=undefined;if(message.error)return showError("Host rejected the MCP App handshake.");if(message.result.protocolVersion!=="2026-01-26")return showError("Unsupported MCP Apps protocol version.");applyHostContext(message.result.hostContext);state.initialized=true;notify("ui/notifications/initialized");return}if(message.method==="ui/notifications/tool-result"){render(message.params&&message.params.structuredContent)}else if(message.method==="ui/notifications/host-context-changed"){applyHostContext(message.params);if(state.draft&&state.controller)render({draft:state.draft,controller:state.controller,editableVariant:state.editableVariant})}else if(message.method==="ping"&&message.id!==undefined)post({jsonrpc:"2.0",id:message.id,result:{}});else if(message.method==="ui/resource-teardown"&&message.id!==undefined)post({jsonrpc:"2.0",id:message.id,result:{}})}, {passive:true});
      window.addEventListener("resize",reportSize,{passive:true});initialize();
    })();
  </script>
