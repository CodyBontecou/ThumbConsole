<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'none'; font-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Thumble Controller Preview</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f4f2ec;
      --card: rgba(255,255,255,.86);
      --stage: #e8e4dc;
      --ink: #171816;
      --muted: #6f716c;
      --line: rgba(23,24,22,.13);
      --shell: #161715;
      --screen: #252724;
      --button: #f0ede5;
      --button-stroke: #aeadA7;
      --button-text: #262724;
      --accent: #ff5a36;
      --accent-soft: #ffb29f;
      --joystick: #93d4c0;
      --trigger: #ffd670;
      --trackpad: #b9c7f7;
      --decoration: #a8aaa4;
      --shadow: 0 24px 70px rgba(34,31,25,.14);
    }
    :root[data-theme="dark"] {
      --page: #151613;
      --card: rgba(31,32,28,.9);
      --stage: #20211e;
      --ink: #f4f2ea;
      --muted: #a7aaa2;
      --line: rgba(255,255,255,.12);
      --shell: #090a09;
      --screen: #1c1e1b;
      --button: #383a35;
      --button-stroke: #5b5e57;
      --button-text: #f6f4ed;
      --accent: #ff7354;
      --accent-soft: #8d3d2c;
      --joystick: #2f7a66;
      --trigger: #8a6926;
      --trackpad: #475886;
      --decoration: #5e615a;
      --shadow: 0 28px 80px rgba(0,0,0,.35);
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; min-height: 100%; background: transparent; color: var(--ink); font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { padding: 12px; }
    .card { width: min(100%, 980px); margin: 0 auto; overflow: hidden; border: 1px solid var(--line); border-radius: 22px; background: var(--card); box-shadow: var(--shadow); backdrop-filter: blur(24px); }
    .header { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; padding: 20px 22px 17px; border-bottom: 1px solid var(--line); }
    .eyebrow { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; color: var(--muted); font-size: 11px; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
    .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent); }
    h1 { margin: 0; font-size: clamp(19px, 3vw, 27px); line-height: 1.12; letter-spacing: -.035em; }
    .meta { margin-top: 6px; color: var(--muted); font-size: 12px; }
    .count { flex: none; display: grid; place-items: center; min-width: 68px; min-height: 58px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 14px; background: color-mix(in srgb, var(--stage) 58%, transparent); }
    .count strong { display: block; font-size: 22px; line-height: 1; letter-spacing: -.04em; }
    .count span { display: block; margin-top: 5px; color: var(--muted); font-size: 9px; font-weight: 750; letter-spacing: .1em; text-transform: uppercase; }
    .stage { position: relative; min-height: 250px; padding: clamp(22px, 5vw, 48px); background: var(--stage); background-image: radial-gradient(circle at 20% 12%, color-mix(in srgb, var(--accent-soft) 22%, transparent), transparent 30%), linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: auto, 24px 24px, 24px 24px; }
    .device { position: relative; width: min(100%, 820px); margin: 0 auto; padding: clamp(6px, 1.2vw, 11px); border-radius: clamp(24px, 4vw, 44px); background: var(--shell); box-shadow: 0 18px 45px rgba(0,0,0,.28), inset 0 0 0 1px rgba(255,255,255,.13); }
    .device::before { content: ""; position: absolute; top: 50%; left: 4px; width: 3px; height: 18%; border-radius: 3px; background: rgba(255,255,255,.13); transform: translateY(-50%); }
    .screen { position: relative; overflow: hidden; border-radius: clamp(18px, 3.2vw, 35px); background: var(--screen); }
    svg { display: block; width: 100%; height: auto; min-height: 150px; }
    .waiting { display: grid; place-items: center; min-height: 250px; padding: 40px; color: var(--muted); text-align: center; }
    .waiting strong { display: block; margin-bottom: 7px; color: var(--ink); font-size: 16px; }
    .footer { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 18px; padding: 13px 20px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
    .legend { display: flex; flex-wrap: wrap; gap: 10px 14px; }
    .legend span { display: inline-flex; align-items: center; gap: 5px; }
    .swatch { width: 7px; height: 7px; border-radius: 2px; }
    .read-only { font-weight: 650; }
    @media (max-width: 520px) {
      body { padding: 6px; }
      .card { border-radius: 16px; }
      .header { padding: 16px; }
      .stage { padding: 20px 12px; }
      .footer { padding: 12px 15px; }
    }
  </style>
</head>
<body>
  <main class="card" aria-live="polite">
    <header class="header">
      <div>
        <div class="eyebrow"><span class="live-dot"></span>Controller canvas</div>
        <h1 id="profile-name">Waiting for controller</h1>
        <div class="meta" id="profile-meta">Connecting to Codex…</div>
      </div>
      <div class="count" aria-label="Visible control count"><strong id="control-count">—</strong><span>Elements</span></div>
    </header>
    <section class="stage" id="stage">
      <div class="waiting" id="waiting"><div><strong>Preparing preview</strong>Waiting for the controller snapshot.</div></div>
      <div class="device" id="device" hidden>
        <div class="screen"><svg id="controller" role="img" aria-labelledby="controller-title controller-description"></svg></div>
      </div>
    </section>
    <footer class="footer">
      <div class="legend" id="legend"></div>
      <div class="read-only" id="preview-note">Read-only live preview · native appearance</div>
    </footer>
  </main>

      }
      function iconGlyph(icon) {
        if (!icon || typeof icon !== "object" || typeof icon.value !== "string") return null;
        if (icon.source === "text") return icon.value;
        const symbols = { "star.fill": "★", "gearshape.fill": "⚙", "house.fill": "⌂", "play.fill": "▶", "pause.fill": "Ⅱ", "cursorarrow": "↖", "arrow.up": "↑", "arrow.down": "↓", "arrow.left": "←", "arrow.right": "→" };
        return symbols[icon.value] || null;
      }
      function appendText(group, text, attributes) {
        const node = svgNode("text", attributes);
        node.textContent = text;
        group.append(node);
      }
      function controlIsValid(element, width, height) {
        if (!element || typeof element !== "object" || typeof element.id !== "string" || typeof element.label !== "string") return false;
        if (!["button", "joystick", "trigger", "trackpad", "text", "decoration"].includes(element.kind)) return false;
        const frame = element.frame;
        if (!frame || !validNumber(frame.x, 0, width) || !validNumber(frame.y, 0, height)) return false;
        if (!validNumber(frame.width, 1, width) || !validNumber(frame.height, 1, height)) return false;
        return frame.x + frame.width <= width + .01 && frame.y + frame.height <= height + .01;
      }
      function render(snapshot) {
        if (!validSnapshot(snapshot)) return showError("The host returned an invalid controller snapshot.");
        state.snapshot = snapshot;
        const width = snapshot.canvas.width;
        const height = snapshot.canvas.height;
        const scheme = effectiveScheme(snapshot);
        const elements = snapshot.elements.filter((element) => controlIsValid(element, width, height));
        profileName.textContent = snapshot.profile.name || "Unnamed profile";
        profileMeta.textContent = `${capitalize(snapshot.orientation)} · ${Math.round(width)}×${Math.round(height)} pt · ${snapshot.profile.orientationPreference || "automatic"}`;
        controlCount.textContent = String(elements.length);
        previewNote.textContent = snapshot.canvas.unsupportedContentOmitted ? "Read-only live preview · artwork omitted" : "Read-only live preview · native appearance";
        svg.replaceChildren();
        svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
        svg.setAttribute("preserveAspectRatio", "xMidYMid meet");

        const title = svgNode("title", { id: "controller-title" });
        title.textContent = `${snapshot.profile.name} controller`;
        const description = svgNode("desc", { id: "controller-description" });
        description.textContent = `${elements.length} visible elements in ${snapshot.orientation} orientation.`;
        const style = svgNode("style");
        style.textContent = ".control-label{font-family:ui-rounded,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-weight:700;text-anchor:middle;dominant-baseline:middle;pointer-events:none}.control-icon{font-family:ui-rounded,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-weight:650;text-anchor:middle;dominant-baseline:middle;pointer-events:none}.track-line{fill:none;vector-effect:non-scaling-stroke}";
        const defs = svgNode("defs");
        svg.append(title, description, style, defs);
        const canvasFallback = scheme === "dark" ? { red: 0, green: 0, blue: 0, alpha: 1 } : { red: 1, green: 1, blue: 1, alpha: 1 };
        const canvasFill = appendFillDefinition(defs, selectedFill(snapshot.canvas, scheme), "canvas-fill", canvasFallback);
        svg.append(svgNode("rect", { class: "canvas", x: 0, y: 0, width, height, fill: canvasFill }));

        elements.forEach((element, index) => {
          const frame = element.frame;
          const cx = frame.x + frame.width / 2;
          const cy = frame.y + frame.height / 2;
          const presentation = resolvePresentation(element, snapshot, scheme);
          const fillPaint = appendFillDefinition(defs, presentation.fill, `control-fill-${index}`, accentColor(element.accentStyle || snapshot.accentStyle || "monochrome", scheme));
          const filter = appendFilter(defs, presentation, `control-filter-${index}`);
          const scale = presentation.scale;
          const transform = `rotate(${finite(element.rotationDegrees, 0)} ${cx} ${cy}) translate(${cx} ${cy}) scale(${scale}) translate(${-cx} ${-cy})`;
          const groupAttributes = { transform, tabindex: "0", role: "img", "aria-label": `${element.label}, ${element.kind}`, opacity: presentation.opacity };
          if (filter) groupAttributes.filter = filter;
          const group = svgNode("g", groupAttributes);
          group.append(shapeNode(element, presentation, fillPaint));

          const foreground = colorCSS(presentation.foreground, scheme === "dark" ? "white" : "black");
          if (element.kind === "joystick") {
            const isThumbstick = element.joystickVisualStyle === "thumbstick";
            const ratio = isThumbstick ? .72 : .34;
            const thumb = (scheme === "dark" ? element.darkThumbFill : element.lightThumbFill) || element.thumbFill || Object.assign({}, presentation.foreground, { alpha: scheme === "dark" ? .30 : .18 });
            group.append(svgNode("ellipse", { class: "joystick-knob", cx, cy, rx: Math.min(frame.width, frame.height) * ratio / 2, ry: Math.min(frame.width, frame.height) * ratio / 2, fill: colorCSS(thumb, foreground), stroke: colorCSS(strokeColor(thumb), foreground), "stroke-width": 1, "vector-effect": "non-scaling-stroke" }));
            if (!isThumbstick && snapshot.showsButtonLabels !== false && element.showsIntegratedLabel !== false) appendText(group, element.label, { class: "control-label", x: cx, y: cy + frame.height * .34, "font-size": Math.min(14, frame.height * .16), fill: foreground });
          } else if (element.kind === "trackpad") {
            group.append(svgNode("rect", { x: frame.x + frame.width * .08, y: frame.y + frame.height * .08, width: frame.width * .84, height: frame.height * .84, rx: Math.max(5, Math.min(frame.width, frame.height) * .08), fill: "none", stroke: foreground, "stroke-opacity": .24, "stroke-width": 1 }));
            group.append(svgNode("path", { class: "track-line", d: `M ${frame.x + frame.width * .33} ${frame.y + frame.height * .86} H ${frame.x + frame.width * .67}`, stroke: foreground, "stroke-width": 5, "stroke-opacity": .28 }));
          }

          const icon = presentation.icon;
          const glyph = iconGlyph(icon);
          const iconPlacement = icon && typeof icon.placement === "string" ? icon.placement : "center";
          if (glyph) {
            const offsets = { leading: [-.20, 0], trailing: [.20, 0], top: [0, -.18], bottom: [0, .18], center: [0, 0], background: [0, 0] };
            const offset = offsets[iconPlacement] || offsets.center;
            const tint = validColor(icon.tintColor) ? colorCSS(icon.tintColor, foreground) : foreground;
            appendText(group, glyph, { class: "control-icon", x: cx + frame.width * offset[0], y: cy + frame.height * offset[1], "font-size": Math.max(12, Math.min(frame.width, frame.height) * .34 * finite(icon.scale, 1)), fill: tint, opacity: iconPlacement === "background" ? .25 : 1 });
          }
          const canShowLabel = snapshot.showsButtonLabels !== false && element.showsIntegratedLabel !== false;
          const shouldShowLabel = element.kind === "text" || (element.kind !== "joystick" && element.kind !== "decoration" && canShowLabel && (!glyph || iconPlacement !== "center" || Array.from(element.label).length <= 2));
          if (shouldShowLabel) {
            const labelOffsets = { leading: [.11, 0], trailing: [-.11, 0], top: [0, .15], bottom: [0, -.15] };
            const offset = glyph ? (labelOffsets[iconPlacement] || [0, 0]) : [0, 0];
            appendText(group, element.label, { class: "control-label", x: cx + frame.width * offset[0], y: cy + frame.height * offset[1], "font-size": labelFontSize(element), fill: foreground });
          } else if (element.kind === "decoration" && element.label !== "Decoration" && glyph === null) {
            appendText(group, element.label, { class: "control-label", x: cx, y: cy, "font-size": labelFontSize(element), fill: foreground });
          }
          svg.append(group);
        });
        renderLegend(elements);
        waiting.hidden = true;
        device.hidden = false;
        requestAnimationFrame(reportSize);
      }
      function renderLegend(elements) {
        const colors = { button: "var(--button)", joystick: "var(--joystick)", trigger: "var(--trigger)", trackpad: "var(--trackpad)", text: "var(--accent-soft)", decoration: "var(--decoration)" };
        legend.replaceChildren();
        const counts = new Map();
        elements.forEach((element) => counts.set(element.kind, (counts.get(element.kind) || 0) + 1));
        counts.forEach((count, kind) => {
          const item = document.createElement("span");
          const swatch = document.createElement("i");
          swatch.className = "swatch";
          swatch.style.background = colors[kind];
          item.append(swatch, document.createTextNode(`${capitalize(kind)} ${count}`));
          legend.append(item);
        });
      }
      function showError(message) {
        waiting.hidden = false;
        device.hidden = true;
        waiting.replaceChildren();
        const box = document.createElement("div");
        const title = document.createElement("strong");
        title.textContent = "Preview unavailable";
        box.append(title, document.createTextNode(message));
        waiting.append(box);
        profileName.textContent = "Controller preview";
        profileMeta.textContent = "No renderable snapshot";
        controlCount.textContent = "0";
        requestAnimationFrame(reportSize);
      }
      function capitalize(value) { return typeof value === "string" && value ? value[0].toUpperCase() + value.slice(1) : "Unknown"; }
      function reportSize() {
        const rect = document.documentElement.getBoundingClientRect();
        notify("ui/notifications/size-changed", { width: Math.ceil(rect.width), height: Math.ceil(document.documentElement.scrollHeight) });
      }

      window.addEventListener("message", (event) => {
        if (event.source !== window.parent) return;
        const message = event.data;
        if (!message || message.jsonrpc !== "2.0") return;
        const isInitializeResponse = !state.initialized
          && state.initializeId !== undefined
          && message.id === state.initializeId
          && typeof message.method !== "string"
          && (message.error || (message.result && Object.prototype.hasOwnProperty.call(message.result, "protocolVersion")));
        if (isInitializeResponse) {
          state.initializeId = undefined;
          if (message.error) return showError("Codex rejected the MCP App handshake.");
          if (message.result.protocolVersion !== "2026-01-26") {
            return showError("Codex returned an unsupported MCP Apps protocol version.");
          }
          applyHostContext(message.result.hostContext);
          state.initialized = true;
          notify("ui/notifications/initialized");
          return;
        }
        if (message.method === "ui/notifications/tool-result") {
          render(message.params && message.params.structuredContent);
        } else if (message.method === "ui/notifications/host-context-changed") {
          applyHostContext(message.params);
          if (state.snapshot) render(state.snapshot);
        } else if (message.method === "ping" && message.id !== undefined) {
          post({ jsonrpc: "2.0", id: message.id, result: {} });
        } else if (message.method === "ui/resource-teardown" && message.id !== undefined) {
          post({ jsonrpc: "2.0", id: message.id, result: {} });
        }
      }, { passive: true });
      window.addEventListener("resize", reportSize, { passive: true });
      initialize();
    })();
  </script>
</body>
</html>
